<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Compras | Gestão de Fornecedores</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lógica da Aplicação -->
    <script src="app.js"></script>
    <!-- Alpine.js via CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col" x-data="fornecedoresApp()" x-init="initApp()">

    <!-- Notificações Flutuantes (Toast) -->
    <div x-cloak x-show="toast.visivel" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-2"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed bottom-5 right-5 z-50 max-w-md w-full shadow-lg rounded-md pointer-events-auto border"
         :class="{
            'bg-green-50 border-green-300 text-green-900': toast.tipo === 'sucesso',
            'bg-red-50 border-red-300 text-red-900': toast.tipo === 'erro',
            'bg-amber-50 border-amber-300 text-amber-900': toast.tipo === 'aviso'
         }">
        <div class="p-4 flex items-start justify-between">
            <div class="flex items-center space-x-3">
                <template x-if="toast.tipo === 'sucesso'">
                    <svg class="h-5 w-5 text-green-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </template>
                <template x-if="toast.tipo === 'erro'">
                    <svg class="h-5 w-5 text-red-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </template>
                <template x-if="toast.tipo === 'aviso'">
                    <svg class="h-5 w-5 text-amber-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </template>
                <p class="text-sm font-medium" x-text="toast.mensagem"></p>
            </div>
            <button @click="toast.visivel = false" class="text-gray-400 hover:text-gray-600 ml-4">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- TELA 1: LOGIN (E-MAIL E SENHA)                                     -->
    <!-- ================================================================== -->
    <template x-if="!usuarioLogado">
        <div class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
            <div class="max-w-md w-full bg-white shadow-sm rounded-md border border-gray-200 overflow-hidden">
                <!-- Cabeçalho Corporativo Azul Escuro -->
                <div class="bg-blue-900 px-6 py-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-xl font-bold tracking-tight">Portal de Fornecedores</h1>
                            <p class="text-xs text-blue-200 mt-1">Sistema Interno da Equipe de Compras</p>
                        </div>
                        <div class="bg-blue-800 p-2.5 rounded-md">
                            <svg class="w-6 h-6 text-blue-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Aviso de Modo Demonstração (Caso credenciais do Supabase não estejam configuradas) -->
                <div x-show="modoDemo" class="bg-amber-50 border-b border-amber-200 px-6 py-3 text-xs text-amber-800">
                    <span class="font-semibold">Modo Demonstração Local Ativo:</span> As credenciais do Supabase ainda não foram inseridas no <code>app.js</code>. Você pode entrar com qualquer e-mail e senha para testar todos os fluxos (incluindo BrasilAPI e persistência local).
                </div>

                <!-- Formulário de Login -->
                <form @submit.prevent="fazerLogin" class="p-6 space-y-4">
                    <div x-show="erroLogin" class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md" x-text="erroLogin"></div>

                    <div>
                        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">E-mail Corporativo</label>
                        <input id="email" type="email" x-model="formLogin.email" required
                               placeholder="nome@empresa.com.br"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900">
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Senha</label>
                        <input id="password" type="password" x-model="formLogin.senha" required
                               placeholder="••••••••"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900">
                    </div>

                    <div class="pt-2">
                        <button type="submit" :disabled="carregandoLogin"
                                class="w-full bg-blue-900 hover:bg-blue-800 disabled:opacity-60 text-white font-medium py-2.5 px-4 rounded-md text-sm transition flex items-center justify-center space-x-2">
                            <svg x-show="carregandoLogin" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span x-text="carregandoLogin ? 'Autenticando...' : 'Acessar Sistema'"></span>
                        </button>
                    </div>

                    <p class="text-[11px] text-center text-gray-400 pt-2">
                        Acesso restrito. Solicite credenciais ao administrador de compras.
                    </p>
                </form>
            </div>
        </div>
    </template>

    <!-- ================================================================== -->
    <!-- TELA 2: LISTA PRINCIPAL DE FORNECEDORES                            -->
    <!-- ================================================================== -->
    <template x-if="usuarioLogado">
        <div class="flex-1 flex flex-col">
            <!-- Barra de Topo Corporativa -->
            <header class="bg-blue-900 text-white shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="bg-blue-800 p-2 rounded-md">
                            <svg class="w-5 h-5 text-blue-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                            </svg>
                        </div>
                        <div>
                            <span class="font-bold text-base tracking-tight block leading-none">Gestão de Fornecedores</span>
                            <span class="text-[11px] text-blue-200 block mt-0.5">Base Centralizada • Compras</span>
                        </div>
                        <span x-show="modoDemo" class="ml-3 bg-amber-400 text-amber-950 text-[10px] font-bold uppercase px-2 py-0.5 rounded-md">
                            Modo Demo Local
                        </span>
                    </div>

                    <div class="flex items-center space-x-4">
                        <div class="hidden sm:block text-right">
                            <span class="text-xs text-blue-200 block">Usuário autenticado</span>
                            <span class="text-xs font-medium text-white" x-text="usuarioLogado.email"></span>
                        </div>
                        <button @click="fazerLogout"
                                class="bg-blue-800 hover:bg-blue-700 text-xs font-medium px-3 py-2 rounded-md border border-blue-700 transition flex items-center space-x-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                            <span>Sair</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Conteúdo Principal -->
            <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
                
                <!-- Resumo Rápido e Ação Principal -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">Fornecedores Cadastrados</h2>
                        <p class="text-sm text-gray-500">Consulte, cadastre e atualize dados comerciais e contatos da rede de fornecedores.</p>
                    </div>
                    <button @click="abrirModalNovo()"
                            class="bg-blue-900 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-md shadow-sm transition inline-flex items-center justify-center space-x-2 shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>Novo Fornecedor</span>
                    </button>
                </div>

                <!-- Barra de Busca e Filtro de Status -->
                <div class="bg-white shadow-sm rounded-md border border-gray-200 p-4 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="md:col-span-3 relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </span>
                            <input type="text" x-model="termoBusca"
                                   placeholder="Buscar por Razão Social, CNPJ, Cidade ou Nome do Contato..."
                                   class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900">
                        </div>
                        <div>
                            <select x-model="filtroStatus"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-blue-900">
                                <option value="todos">Todos os status</option>
                                <option value="ativo">Somente Ativos</option>
                                <option value="inativo">Somente Inativos</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Estado 1: Carregando Lista -->
                <div x-show="carregandoLista" class="bg-white shadow-sm rounded-md border border-gray-200 p-12 text-center">
                    <svg class="animate-spin h-8 w-8 text-blue-900 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-sm text-gray-600 font-medium">Carregando base de fornecedores...</p>
                </div>

                <!-- Estado 2: Lista Vazia -->
                <div x-show="!carregandoLista && fornecedoresFiltrados.length === 0" class="bg-white shadow-sm rounded-md border border-gray-200 p-12 text-center">
                    <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-3 text-gray-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h3 class="text-base font-semibold text-gray-800">Nenhum fornecedor encontrado</h3>
                    <p class="text-xs text-gray-500 mt-1 max-w-md mx-auto">
                        Não encontramos registros com os critérios selecionados. Clique em "Novo Fornecedor" para realizar o cadastro via CNPJ.
                    </p>
                </div>

                <!-- Estado 3: Tabela de Fornecedores -->
                <div x-show="!carregandoLista && fornecedoresFiltrados.length > 0" class="bg-white shadow-sm rounded-md border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-left text-sm">
                            <thead class="bg-gray-100 text-xs font-semibold uppercase tracking-wider text-gray-600">
                                <tr>
                                    <th class="px-5 py-3.5">Razão Social / CNPJ</th>
                                    <th class="px-5 py-3.5">Localização</th>
                                    <th class="px-5 py-3.5">Contato Principal</th>
                                    <th class="px-5 py-3.5">Status</th>
                                    <th class="px-5 py-3.5 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <template x-for="fornecedor in fornecedoresFiltrados" :key="fornecedor.id">
                                    <tr class="hover:bg-gray-50 transition" :class="{'opacity-60 bg-gray-50/50': fornecedor.status === 'inativo'}">
                                        <!-- Razão Social e CNPJ -->
                                        <td class="px-5 py-4">
                                            <div class="font-semibold text-gray-900" x-text="fornecedor.razao_social"></div>
                                            <div class="text-xs text-gray-500 font-mono mt-0.5" x-text="formatarCNPJ(fornecedor.cnpj)"></div>
                                        </td>

                                        <!-- Cidade / UF -->
                                        <td class="px-5 py-4 text-gray-700">
                                            <span x-text="fornecedor.cidade || '-'"></span>
                                            <span x-show="fornecedor.uf" class="text-xs font-semibold text-gray-500" x-text="' / ' + fornecedor.uf"></span>
                                        </td>

                                        <!-- Contatos -->
                                        <td class="px-5 py-4">
                                            <template x-if="fornecedor.contatos && fornecedor.contatos.length > 0">
                                                <div>
                                                    <div class="font-medium text-gray-800" x-text="fornecedor.contatos[0].nome"></div>
                                                    <div class="text-xs text-gray-500">
                                                        <span x-text="fornecedor.contatos[0].email || 'Sem e-mail'"></span>
                                                        <span x-show="fornecedor.contatos[0].telefone" x-text="' • ' + fornecedor.contatos[0].telefone"></span>
                                                    </div>
                                                    <span x-show="fornecedor.contatos.length > 1"
                                                          class="inline-block mt-1 text-[11px] bg-blue-50 text-blue-800 px-2 py-0.5 rounded font-medium"
                                                          x-text="'+' + (fornecedor.contatos.length - 1) + ' contato(s)'"></span>
                                                </div>
                                            </template>
                                            <template x-if="!fornecedor.contatos || fornecedor.contatos.length === 0">
                                                <span class="text-xs text-gray-400 italic">Nenhum contato cadastrado</span>
                                            </template>
                                        </td>

                                        <!-- Status -->
                                        <td class="px-5 py-4">
                                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold"
                                                  :class="fornecedor.status === 'ativo' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-700'">
                                                <span class="w-1.5 h-1.5 rounded-full mr-1.5"
                                                      :class="fornecedor.status === 'ativo' ? 'bg-green-600' : 'bg-gray-500'"></span>
                                                <span x-text="fornecedor.status === 'ativo' ? 'Ativo' : 'Inativo'"></span>
                                            </span>
                                        </td>

                                        <!-- Ações (Editar / Ativar-Inativar) -->
                                        <td class="px-5 py-4 text-right whitespace-nowrap space-x-2">
                                            <button @click="abrirModalEdicao(fornecedor)"
                                                    class="text-xs font-medium text-blue-900 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-md transition">
                                                Editar
                                            </button>
                                            <button @click="alternarStatusFornecedor(fornecedor)"
                                                    class="text-xs font-medium px-3 py-1.5 rounded-md transition"
                                                    :class="fornecedor.status === 'ativo' 
                                                        ? 'text-red-700 hover:text-red-800 bg-red-50 hover:bg-red-100' 
                                                        : 'text-green-700 hover:text-green-800 bg-green-50 hover:bg-green-100'"
                                                    x-text="fornecedor.status === 'ativo' ? 'Inativar' : 'Reativar'">
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <!-- ================================================================== -->
    <!-- TELA 3: MODAL DE CADASTRO E EDIÇÃO DE FORNECEDOR                   -->
    <!-- ================================================================== -->
    <div x-cloak x-show="modalAberto"
         class="fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4 overflow-y-auto"
         @keydown.escape.window="fecharModal()">
        
        <div @click.away="fecharModal()"
             class="bg-white rounded-md shadow-xl border border-gray-200 max-w-2xl w-full overflow-hidden my-8">
            
            <!-- Cabeçalho do Modal -->
            <div class="bg-blue-900 text-white px-6 py-4 flex items-center justify-between">
                <div>
                    <h3 class="text-base font-bold" x-text="modoEdicao ? 'Editar Fornecedor' : 'Novo Cadastro de Fornecedor'"></h3>
                    <p class="text-xs text-blue-200 mt-0.5">Consulte o CNPJ para preenchimento automático ou preencha manualmente.</p>
                </div>
                <button @click="fecharModal()" class="text-blue-200 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Formulário do Modal -->
            <form @submit.prevent="salvarFornecedor" class="p-6 space-y-6 max-h-[82vh] overflow-y-auto">
                
                <!-- Seção 1: Busca de CNPJ (BrasilAPI) -->
                <div class="bg-gray-50 p-4 rounded-md border border-gray-200">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700 mb-1.5">
                        1. CNPJ do Fornecedor *
                    </label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" x-model="formFornecedor.cnpj"
                               @input="aplicarMascaraCNPJ"
                               maxlength="18"
                               placeholder="00.000.000/0000-00"
                               required
                               class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-900">
                        
                        <button type="button" @click="buscarCNPJ()" :disabled="buscandoCNPJ"
                                class="bg-blue-900 hover:bg-blue-800 disabled:opacity-60 text-white text-xs font-semibold px-4 py-2.5 rounded-md transition inline-flex items-center justify-center space-x-2 shrink-0">
                            <svg x-show="buscandoCNPJ" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <svg x-show="!buscandoCNPJ" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <span x-text="buscandoCNPJ ? 'Consultando BrasilAPI...' : 'Buscar CNPJ'"></span>
                        </button>
                    </div>

                    <!-- Feedback de Exceção ou Sucesso da API -->
                    <div x-show="avisoAPI.visivel" class="mt-3 p-3 rounded-md text-xs flex items-start space-x-2 border"
                         :class="{
                            'bg-amber-50 border-amber-300 text-amber-900': avisoAPI.tipo === 'erro',
                            'bg-green-50 border-green-300 text-green-900': avisoAPI.tipo === 'sucesso'
                         }">
                        <span x-text="avisoAPI.mensagem"></span>
                    </div>
                </div>

                <!-- Seção 2: Dados Cadastrais da Empresa -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-500">2. Dados Cadastrais</h4>
                        <button type="button" x-show="!camposLiberados" @click="camposLiberados = true"
                                class="text-xs text-blue-900 hover:underline font-medium">
                            Liberar digitação manual
                        </button>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Razão Social *</label>
                        <input type="text" x-model="formFornecedor.razao_social"
                               :readonly="!camposLiberados"
                               required
                               placeholder="Consulte o CNPJ ou digite a Razão Social"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"
                               :class="{'bg-gray-100 text-gray-500 cursor-not-allowed': !camposLiberados}">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Cidade *</label>
                            <input type="text" x-model="formFornecedor.cidade"
                                   :readonly="!camposLiberados"
                                   required
                                   placeholder="Ex: Joinville"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-900"
                                   :class="{'bg-gray-100 text-gray-500 cursor-not-allowed': !camposLiberados}">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">UF *</label>
                            <input type="text" x-model="formFornecedor.uf"
                                   :readonly="!camposLiberados"
                                   maxlength="2"
                                   required
                                   placeholder="SC"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm uppercase focus:outline-none focus:ring-2 focus:ring-blue-900"
                                   :class="{'bg-gray-100 text-gray-500 cursor-not-allowed': !camposLiberados}">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Status</label>
                            <select x-model="formFornecedor.status"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                                <option value="ativo">Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Seção 3: Contatos do Fornecedor -->
                <div class="border-t border-gray-200 pt-5">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-500">3. Contatos Comerciais</h4>
                            <p class="text-xs text-gray-400">Adicione pelo menos um contato responsável pelo atendimento.</p>
                        </div>
                        <button type="button" @click="adicionarLinhaContato()"
                                class="text-xs font-semibold text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-md transition inline-flex items-center space-x-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            <span>Adicionar Contato</span>
                        </button>
                    </div>

                    <div class="space-y-3">
                        <template x-for="(contato, index) in formFornecedor.contatos" :key="index">
                            <div class="p-3 bg-gray-50 rounded-md border border-gray-200 grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end">
                                <div class="sm:col-span-4">
                                    <label class="block text-[11px] font-medium text-gray-600 mb-1">Nome do Contato *</label>
                                    <input type="text" x-model="contato.nome" required
                                           placeholder="Ex: Ana Souza"
                                           class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                                </div>
                                <div class="sm:col-span-4">
                                    <label class="block text-[11px] font-medium text-gray-600 mb-1">E-mail</label>
                                    <input type="email" x-model="contato.email"
                                           placeholder="vendas@fornecedor.com.br"
                                           class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                                </div>
                                <div class="sm:col-span-3">
                                    <label class="block text-[11px] font-medium text-gray-600 mb-1">Telefone / WhatsApp</label>
                                    <input type="text" x-model="contato.telefone"
                                           placeholder="(47) 99999-0000"
                                           class="w-full px-2.5 py-1.5 border border-gray-300 rounded-md text-xs bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                                </div>
                                <div class="sm:col-span-1 flex justify-end">
                                    <button type="button" @click="removerLinhaContato(index)"
                                            :disabled="formFornecedor.contatos.length === 1"
                                            title="Remover contato"
                                            class="p-1.5 text-gray-400 hover:text-red-600 disabled:opacity-30 rounded-md">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Rodapé de Ações do Modal -->
                <div class="border-t border-gray-200 pt-4 flex items-center justify-end space-x-3">
                    <button type="button" @click="fecharModal()"
                            class="px-4 py-2 border border-gray-300 text-gray-700 hover:bg-gray-100 rounded-md text-xs font-semibold transition">
                        Cancelar
                    </button>
                    <button type="submit" :disabled="salvandoFornecedor"
                            class="bg-blue-900 hover:bg-blue-800 disabled:opacity-60 text-white px-5 py-2 rounded-md text-xs font-semibold transition inline-flex items-center space-x-2">
                        <svg x-show="salvandoFornecedor" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span x-text="salvandoFornecedor ? 'Salvando...' : (modoEdicao ? 'Salvar Alterações' : 'Cadastrar Fornecedor')"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
